name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  STAGE: prod

jobs:
  deploy:
    name: Build & Deploy Lambda
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.DEPLOY_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.DEPLOY_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Build
        working-directory: backend
        run: |
          npm ci
          npm run build
      - name: Package
        working-directory: backend
        run: |
          mkdir -p lambda-package/dist
          cp -r dist/* lambda-package/dist/
          cp package.json lambda-package/
          cd lambda-package && npm ci --omit=dev
          zip -r ../lambda.zip .
      - name: Upload to S3
        run: aws s3 cp backend/lambda.zip s3://gym.oc.taglineconsultants.com/lambda/lambda.zip
      - name: Update Lambda Function
        run: |
          FUNCTION_NAME=$(aws cloudformation describe-stacks \
            --stack-name "gym-workout-engine-backend-${{ env.STAGE }}" \
            --query "Stacks[0].Outputs[?OutputKey=='FunctionName'].OutputValue" \
            --output text)
          aws lambda update-function-code \
            --function-name $FUNCTION_NAME \
            --s3-bucket gym.oc.taglineconsultants.com \
            --s3-key lambda/lambda.zip
          aws lambda wait function-updated --function-name $FUNCTION_NAME
      - name: Verify Deploy
        run: |
          ENDPOINT=$(aws cloudformation describe-stacks \
            --stack-name "gym-workout-engine-backend-${{ env.STAGE }}" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiEndpoint'].OutputValue" \
            --output text)
          curl -f "$ENDPOINT/api/health" || exit 1
          echo "✅ Backend deploy verified"
