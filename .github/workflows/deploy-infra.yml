name: Deploy Infrastructure

on:
  push:
    branches: [main]
    paths:
      - 'infrastructure/cloudformation/**'
  workflow_dispatch:
    inputs:
      stage:
        description: 'Deployment stage'
        required: true
        default: 'prod'
        type: choice
        options: [prod, staging]

env:
  AWS_REGION: us-east-1
  STAGE: ${{ github.event.inputs.stage || 'prod' }}

jobs:
  deploy-storage:
    name: Deploy Storage (DynamoDB)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy DynamoDB Stack
        run: |
          aws cloudformation deploy \
            --template-file infrastructure/cloudformation/02-storage.yaml \
            --stack-name "gym-workout-engine-storage-${{ env.STAGE }}" \
            --parameter-overrides Stage=${{ env.STAGE }} \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset

  deploy-backend:
    name: Deploy Backend (Lambda + API Gateway)
    runs-on: ubuntu-latest
    needs: deploy-storage
    permissions:
      id-token: write
      contents: read
    outputs:
      api-endpoint: ${{ steps.get-api.outputs.endpoint }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Build Backend
        working-directory: backend
        run: |
          npm ci
          npm run build
          # Zip dist contents to zip root (handler = lambda.handler)
          cd dist && zip -r ../lambda.zip . && cd ..
          # Add production node_modules to zip root
          zip -r lambda.zip node_modules
      - name: Upload Lambda zip to S3
        run: aws s3 cp backend/lambda.zip s3://gym.oc.taglineconsultants.com/lambda/lambda.zip
      - name: Cleanup failed Backend stack if needed
        run: |
          STATUS=$(aws cloudformation describe-stacks \
            --stack-name "gym-workout-engine-backend-${{ env.STAGE }}" \
            --query "Stacks[0].StackStatus" --output text 2>/dev/null || echo "DOES_NOT_EXIST")
          echo "Stack status: $STATUS"
          if [ "$STATUS" = "ROLLBACK_COMPLETE" ] || [ "$STATUS" = "UPDATE_ROLLBACK_COMPLETE" ]; then
            echo "Deleting stuck stack before re-deploy..."
            aws cloudformation delete-stack --stack-name "gym-workout-engine-backend-${{ env.STAGE }}"
            aws cloudformation wait stack-delete-complete --stack-name "gym-workout-engine-backend-${{ env.STAGE }}"
            echo "Stack deleted — will re-create fresh"
          fi
      - name: Deploy Backend Stack
        run: |
          aws cloudformation deploy \
            --template-file infrastructure/cloudformation/03-backend.yaml \
            --stack-name "gym-workout-engine-backend-${{ env.STAGE }}" \
            --parameter-overrides Stage=${{ env.STAGE }} \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset || (
              echo "=== CloudFormation Stack Events ==="
              aws cloudformation describe-stack-events \
                --stack-name "gym-workout-engine-backend-${{ env.STAGE }}" \
                --query 'StackEvents[?contains(`["CREATE_FAILED","UPDATE_FAILED","ROLLBACK_IN_PROGRESS"]`, ResourceStatus)].{Resource:LogicalResourceId,Status:ResourceStatus,Reason:ResourceStatusReason}' \
                --output table
              exit 1
            )
      - name: Get API Endpoint
        id: get-api
        run: |
          ENDPOINT=$(aws cloudformation describe-stacks \
            --stack-name "gym-workout-engine-backend-${{ env.STAGE }}" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiEndpoint'].OutputValue" \
            --output text)
          echo "endpoint=$ENDPOINT" >> $GITHUB_OUTPUT

  deploy-frontend-infra:
    name: Deploy Frontend Infrastructure (CloudFront)
    runs-on: ubuntu-latest
    needs: deploy-backend
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Package Lambda@Edge Auth Function
        run: |
          cd infrastructure/lambda-edge-auth
          zip -j edge-auth.zip index.js
          aws s3 cp edge-auth.zip s3://gym.oc.taglineconsultants.com/lambda/edge-auth.zip
      - name: Deploy Frontend Stack
        run: |
          aws cloudformation deploy \
            --template-file infrastructure/cloudformation/04-frontend.yaml \
            --stack-name "gym-workout-engine-frontend-${{ env.STAGE }}" \
            --parameter-overrides \
              Stage=${{ env.STAGE }} \
              ApiEndpoint=${{ needs.deploy-backend.outputs.api-endpoint }} \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset
      - name: Deploy DNS Stack
        run: |
          CF_DOMAIN=$(aws cloudformation describe-stacks \
            --stack-name "gym-workout-engine-frontend-${{ env.STAGE }}" \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionDomain'].OutputValue" \
            --output text)
          aws cloudformation deploy \
            --template-file infrastructure/cloudformation/05-dns.yaml \
            --stack-name "gym-workout-engine-dns-${{ env.STAGE }}" \
            --parameter-overrides CloudFrontDomain=$CF_DOMAIN \
            --no-fail-on-empty-changeset
